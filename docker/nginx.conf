server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    location = /captures {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location /captures/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://api:8000;
    }


    location = /replay/sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/replay/";
        try_files $uri =404;
    }


    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }


    location / {
        try_files $uri $uri/ /index.html;
    }
}
