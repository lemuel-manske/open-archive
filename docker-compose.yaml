services:
  api:
    build:
      context: .

      dockerfile: docker/api.dockerfile

    environment:
      MONGO_URI: mongodb://mongodb:27017/

    ports:
      - "8000:8000"

    depends_on:
      - mongodb

    restart: unless-stopped

  worker:
    build:
      context: .

      dockerfile: docker/worker.dockerfile

    environment:
      MONGO_URI: mongodb://mongodb:27017/
      CRAWLS_PATH: /crawls
      CRAWLS_VOLUME: ${CRAWLS_HOST_DIR}

    volumes:
      - ${CRAWLS_HOST_DIR}:/crawls
      - /var/run/docker.sock:/var/run/docker.sock

    depends_on:
      - mongodb

    restart: unless-stopped

  mongodb:
    image: mongo:8

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongo_data:/data/db

  mongoexpress:
    image: mongo-express:1.0.0

    ports:
      - "127.0.0.1:8081:8081"

    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"

    depends_on:
      - mongodb

volumes:
  mongo_data:
