services:
  mongodb:
    image: mongo:8

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongo_data:/data/db

  mongoexpress:
    image: mongo-express:1.0.0

    ports:
      - "127.0.0.1:8081:8081"

    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"

    depends_on:
      - mongodb

volumes:
  mongo_data:
